name: CI

on:
  pull_request:
  push:
    branches: [main]

# Um push novo no mesmo PR cancela a execução anterior; na main, cada push roda até o fim.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verificar:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Versão do pnpm vem do campo packageManager do package.json
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Lint e formatação
        run: pnpm lint

      - name: Checagem de tipos
        run: pnpm typecheck

      - name: Testes
        run: pnpm test

      - name: Build
        run: pnpm build

  # Substitui o Supabase local: sobe o stack no runner (que tem Docker), aplica migrations e seed
  # do zero e roda os testes pgTAP de supabase/tests.
  banco:
    name: Banco (migrations, seed e pgTAP)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Subir Supabase (Postgres, Auth, Storage e API)
        run: pnpm exec supabase start -x realtime,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Aplicar migrations e seed do zero
        run: pnpm exec supabase db reset

      - name: Lint do schema (plpgsql_check)
        run: pnpm exec supabase db lint --local --schema public,private --fail-on error

      - name: Testes pgTAP
        run: pnpm exec supabase test db

      # Sem Docker local, é aqui que os tipos do front são gerados a partir do schema real.
      - name: Tipos do banco em dia (apps/web/src/lib/database.types.ts)
        run: |
          pnpm db:types
          if ! git diff --exit-code -- apps/web/src/lib/database.types.ts; then
            echo "::error::database.types.ts desatualizado. Baixe o artefato 'tipos-do-banco' deste job e commite o arquivo."
            exit 1
          fi

      - name: Publicar tipos gerados
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: tipos-do-banco
          path: apps/web/src/lib/database.types.ts
          if-no-files-found: ignore

      - name: Parar Supabase
        if: always()
        run: pnpm exec supabase stop --no-backup

name: Deploy produção

# Disparo manual (Actions -> Deploy produção -> Run workflow), só a partir da main.
# As credenciais vivem nos environments supabase-staging e supabase-producao, liberados só para a
# main (docs/setup.md, passo 3): o `if` abaixo é só conveniência, quem barra outra branch é o environment.
# Ordem garantida: staging em dia -> banco de produção -> front de produção (deploy hook da Vercel).
on:
  workflow_dispatch:

# Mesmo grupo do workflow Migrations na main: nunca dois deploys mexendo em staging ao mesmo tempo.
concurrency:
  group: migrations-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  staging:
    name: Garantir staging em dia
    if: github.ref == 'refs/heads/main'
    environment: supabase-staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_PROJECT_ID: ${{ vars.DEPLOY_SUPABASE_PROJECT_ID }}
    steps:
      - name: Conferir configuração de staging
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.DEPLOY_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.DEPLOY_SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "::error::Configure o environment supabase-staging conforme docs/setup.md."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Sem segredos no ambiente da instalação: eles só entram nos passos que falam com o Supabase.
      - run: pnpm install --frozen-lockfile
      - name: Ligar ao projeto de staging
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.DEPLOY_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.DEPLOY_SUPABASE_DB_PASSWORD }}
        run: pnpm exec supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Aplicar migrations pendentes em staging (sem efeito se já estiver em dia)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.DEPLOY_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.DEPLOY_SUPABASE_DB_PASSWORD }}
        run: pnpm exec supabase db push
      - name: Publicar Edge Functions em staging
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.DEPLOY_SUPABASE_ACCESS_TOKEN }}
        run: pnpm exec supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID" --use-api

  producao:
    name: Migrations e front em produção
    needs: staging
    if: github.ref == 'refs/heads/main'
    environment: supabase-producao
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_PROJECT_ID: ${{ vars.DEPLOY_SUPABASE_PROJECT_ID }}
    steps:
      - name: Conferir configuração de produção
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.DEPLOY_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.DEPLOY_SUPABASE_DB_PASSWORD }}
          VERCEL_DEPLOY_HOOK: ${{ secrets.DEPLOY_VERCEL_HOOK }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_PROJECT_ID" ] || [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo "::error::Configure o environment supabase-producao conforme docs/setup.md."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Ligar ao projeto de produção
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.DEPLOY_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.DEPLOY_SUPABASE_DB_PASSWORD }}
        run: pnpm exec supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Aplicar migrations em produção
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.DEPLOY_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.DEPLOY_SUPABASE_DB_PASSWORD }}
        run: pnpm exec supabase db push
      - name: Publicar Edge Functions em produção
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.DEPLOY_SUPABASE_ACCESS_TOKEN }}
        run: pnpm exec supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID" --use-api
      - name: Publicar front de produção na Vercel
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.DEPLOY_VERCEL_HOOK }}
        run: curl --fail --silent --show-error --request POST "$VERCEL_DEPLOY_HOOK" > /dev/null

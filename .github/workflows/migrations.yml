name: Migrations

# Staging recebe as migrations e as Edge Functions a cada push na main. Produção é manual: deploy-producao.yml.
# A Vercel não publica a main sozinha (vercel.json); o front de produção só sai depois da migration.
on:
  push:
    branches: [main]

# Nunca cancelar uma aplicação de migration em andamento; execuções na main entram em fila.
concurrency:
  group: migrations-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  staging:
    name: Aplicar migrations em staging
    environment: supabase-staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.DEPLOY_SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.DEPLOY_SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ vars.DEPLOY_SUPABASE_PROJECT_ID }}
    steps:
      - name: Conferir configuração de staging
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "::error::Configure o environment supabase-staging conforme docs/setup.md."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Ligar ao projeto de staging
        run: pnpm exec supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Aplicar migrations
        run: pnpm exec supabase db push
      # O segredo OPENROUTER_API_KEY é cadastrado uma vez no projeto (docs/setup.md), nunca aqui.
      - name: Publicar Edge Functions
        run: pnpm exec supabase functions deploy extrair-licenca --project-ref "$SUPABASE_PROJECT_ID" --use-api

name: Migrations

# Staging recebe as migrations e as Edge Functions a cada push na main. Produção é manual: deploy-producao.yml.
# A Vercel não publica a main sozinha (vercel.json); o front de produção só sai depois da migration.
on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - '.github/workflows/migrations.yml'
  push:
    branches: [main]

# Nunca cancelar uma aplicação de migration em andamento; execuções na main entram em fila.
concurrency:
  group: migrations-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Em PR: mostra o que seria aplicado em staging, sem aplicar.
  conferir-staging:
    name: Conferir migrations contra staging (dry-run)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID_STAGING }}
    steps:
      - name: Verificar segredos
        id: segredos
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "::notice::Segredos de staging ainda não cadastrados (docs/setup.md). Dry-run pulado."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.segredos.outputs.ok == 'true'
      - uses: pnpm/action-setup@v6
        if: steps.segredos.outputs.ok == 'true'
      - uses: actions/setup-node@v7
        if: steps.segredos.outputs.ok == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.segredos.outputs.ok == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.segredos.outputs.ok == 'true'
        run: pnpm exec supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - if: steps.segredos.outputs.ok == 'true'
        run: pnpm exec supabase db push --dry-run

  staging:
    name: Aplicar migrations em staging
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID_STAGING }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Ligar ao projeto de staging
        run: pnpm exec supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Aplicar migrations
        run: pnpm exec supabase db push
      # O segredo OPENROUTER_API_KEY é cadastrado uma vez no projeto (docs/setup.md), nunca aqui.
      - name: Publicar Edge Functions
        run: pnpm exec supabase functions deploy extrair-licenca --project-ref "$SUPABASE_PROJECT_ID" --use-api

name: Migrations

# Staging recebe as migrations e as Edge Functions a cada push na main. Produção é manual: deploy-producao.yml.
# A Vercel não publica a main sozinha (vercel.json); o front de produção só sai depois da migration.
# As credenciais vivem no environment supabase-staging, liberado só para a main (docs/setup.md, passo 3):
# workflow de PR ou de outra branch, mesmo editado, não recebe o token. Em PR, quem valida as
# migrations é o job `banco` do CI, com Supabase descartável no runner.
on:
  push:
    branches: [main]

# Nunca cancelar uma aplicação de migration em andamento; execuções na main entram em fila.
concurrency:
  group: migrations-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  staging:
    name: Aplicar migrations em staging
    environment: supabase-staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_PROJECT_ID: ${{ vars.DEPLOY_SUPABASE_PROJECT_ID }}
    steps:
      - name: Conferir configuração de staging
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.DEPLOY_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.DEPLOY_SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "::error::Configure o environment supabase-staging conforme docs/setup.md."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Sem segredos no ambiente da instalação: eles só entram nos passos que falam com o Supabase.
      - run: pnpm install --frozen-lockfile
      - name: Ligar ao projeto de staging
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.DEPLOY_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.DEPLOY_SUPABASE_DB_PASSWORD }}
        run: pnpm exec supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Aplicar migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.DEPLOY_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.DEPLOY_SUPABASE_DB_PASSWORD }}
        run: pnpm exec supabase db push
      # Todas as funções de supabase/functions; o verify_jwt de cada uma vem do config.toml.
      # Os segredos das funções (OPENROUTER_API_KEY etc.) são cadastrados no projeto (docs/setup.md), nunca aqui.
      - name: Publicar Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.DEPLOY_SUPABASE_ACCESS_TOKEN }}
        run: pnpm exec supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID" --use-api
